<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque BDBOOK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        /* Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .dashboard-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 1.3em;
        }

        /* Search Section */
        .search-box {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]::placeholder {
            color: #999;
        }

        /* Results */
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            min-height: 100px;
        }

        .book-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .book-item:hover {
            background: #e8eaf6;
            transform: translateX(5px);
        }

        .book-item h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .book-item p {
            color: #666;
            font-size: 0.95em;
        }

        .book-subject {
            color: #764ba2;
            font-weight: 600;
        }

        /* File Dashboard */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .file-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-item:hover {
            border-color: #667eea;
            background: #e8eaf6;
            transform: scale(1.05);
        }

        .file-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .file-link {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
        }

        .file-link:hover {
            text-decoration: underline;
        }

        /* Loading & Empty States */
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        /* Error Alert */
        .error-alert {
            background: #fee;
            border-left: 4px solid #f44;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error-icon {
            margin-right: 10px;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
        }

        .stat {
            flex: 1;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #999;
        }

        /* Buttons */
        .button {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .button-small {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .files-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            #results {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
            }
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            color: white;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>📚 Catalogue BDBOOK</h1>
            <p class="subtitle">Votre bibliothèque numérique de bandes dessinées</p>
        </header>

        <!-- Dashboard Grid -->
        <div class="dashboard">
            <!-- Search & Books Section -->
            <div class="dashboard-card">
                <h2><span class="icon">🔍</span> Rechercher des Livres</h2>
                <div class="search-box">
                    <input type="text" id="search" placeholder="Rechercher par titre, sujet, auteur...">
                </div>
                <div id="results" class="loading">Chargement du catalogue...</div>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="totalBooks">0</div>
                        <div class="stat-label">Livres Total</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="resultCount">0</div>
                        <div class="stat-label">Résultats</div>
                    </div>
                </div>
            </div>

            <!-- File Dashboard Section -->
            <div class="dashboard-card">
                <h2><span class="icon">📁</span> Fichiers du Projet</h2>
                <p style="color: #666; margin-bottom: 15px; font-size: 0.95em;">Accédez et gérez les fichiers de votre projet</p>
                <div class="files-grid" id="filesGrid">
                    <div class="loading">Chargement des fichiers...</div>
                </div>
            </div>
        </div>

        <!-- Error Container -->
        <div id="errorContainer"></div>

        <!-- Footer -->
        <footer>
            <p>© 2024 BDBOOK - Gestion de Bibliothèque Numérique</p>
        </footer>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            catalogFile: 'catalogue.json',
            repoUrl: 'https://github.com/JakOu2/BDBOOK-PROJECT',
            files: [
                { name: 'index.html', icon: '📄', type: 'HTML' },
                { name: 'catalogue.json', icon: '📊', type: 'JSON' },
                { name: 'README.md', icon: '📖', type: 'Markdown' }
            ]
        };

        // State
        let allBooks = [];
        let searchTimeout;

        // Utility: Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Utility: Show error message
        function showError(message) {
            const container = document.getElementById('errorContainer');
            container.innerHTML = `
                <div class="error-alert">
                    <span class="error-icon">❌</span>
                    <strong>Erreur:</strong> ${escapeHtml(message)}
                </div>
            `;
            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }

        // Load catalogue from JSON with improved error handling
        async function loadCatalogue() {
            try {
                const response = await fetch(CONFIG.catalogFile);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Impossible de charger le catalogue. Assurez-vous d'ouvrir la page via un serveur web local (pas file://).`);
                }
                const data = await response.json();
                
                if (!Array.isArray(data)) {
                    throw new Error('Format de catalogue invalide');
                }

                allBooks = data;
                document.getElementById('totalBooks').textContent = allBooks.length;
                document.getElementById('resultCount').textContent = allBooks.length;
                
                renderBooks(allBooks);
                setupSearch();
            } catch (error) {
                console.error('Erreur de chargement du catalogue:', error);
                showError(error.message);
                const resultsContainer = document.getElementById('results');
                resultsContainer.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Impossible de charger le catalogue</p>
                        <p style="font-size: 0.9em; color: #999;">
                            ${error.message.includes('file://') ? 
                                'Conseil: Ouvrez la page avec un serveur local (python -m http.server 8000)' : 
                                escapeHtml(error.message)
                            }
                        </p>
                    </div>
                `;
            }
        }

        // Render books
        function renderBooks(books) {
            const container = document.getElementById('results');
            
            if (books.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📭</div>
                        <p>Aucun livre trouvé</p>
                        <p style="font-size: 0.9em; color: #999;">Essayez une autre recherche</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = books.map(book => `
                <div class="book-item" title="${escapeHtml(book.titre || '')}">
                    <h3>📕 ${escapeHtml(book.titre || 'Sans titre')}</h3>
                    <p>
                        <strong>Sujet:</strong><br>
                        <span class="book-subject">${escapeHtml(book.sujet || 'Non spécifié')}</span>
                    </p>
                    ${book.auteur ? `<p><strong>Auteur:</strong> ${escapeHtml(book.auteur)}</p>` : ''}
                    ${book.annee ? `<p><strong>Année:</strong> ${escapeHtml(String(book.annee))}</p>` : ''}
                    ${book.lien ? `<p><a href="${escapeHtml(book.lien)}" target="_blank" rel="noopener noreferrer" style="color: #667eea; text-decoration: none;">Voir le lien →</a></p>` : ''}
                </div>
            `).join('');
        }

        // Debounce function for search
        function debounce(func, delay) {
            return function(...args) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => func(...args), delay);
            };
        }

        // Setup search functionality
        function setupSearch() {
            const searchInput = document.getElementById('search');
            if (!searchInput) return;
            
            searchInput.addEventListener('input', debounce((e) => {
                const query = e.target.value.toLowerCase().trim();
                
                if (!query) {
                    document.getElementById('resultCount').textContent = allBooks.length;
                    renderBooks(allBooks);
                    return;
                }

                const filtered = allBooks.filter(book => {
                    const titre = (book.titre || '').toLowerCase();
                    const sujet = (book.sujet || '').toLowerCase();
                    const auteur = (book.auteur || '').toLowerCase();
                    
                    return titre.includes(query) || 
                           sujet.includes(query) || 
                           auteur.includes(query);
                });

                document.getElementById('resultCount').textContent = filtered.length;
                renderBooks(filtered);
            }, 300));
        }

        // Load project files
        function loadProjectFiles() {
            const filesGrid = document.getElementById('filesGrid');
            
            filesGrid.innerHTML = CONFIG.files.map(file => `
                <div class="file-item">
                    <div class="file-icon">${file.icon}</div>
                    <div class="file-name">${escapeHtml(file.name)}</div>
                    <div style="font-size: 0.85em; color: #999; margin-bottom: 8px;">${file.type}</div>
                    <a href="${CONFIG.repoUrl}/blob/main/${encodeURIComponent(file.name)}" 
                       class="file-link" target="_blank" rel="noopener noreferrer">
                        Voir sur GitHub →
                    </a>
                </div>
            `).join('');
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadCatalogue();
            loadProjectFiles();
        });

        // Log page protocol for debugging
        console.log('Page protocol:', window.location.protocol);
        if (window.location.protocol === 'file:') {
            console.warn('⚠️ Page ouverte avec le protocole file://. Pour charger catalogue.json, utilisez un serveur web local.');
        }
    </script>
</body>
</html>
